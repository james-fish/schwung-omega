name: CI

on:
  push:
  pull_request:

jobs:
  native-test:
    name: Native offline harness (make test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make test
        run: make test

  cross-build-gate:
    name: Docker cross-build + glibc gate
    runs-on: ubuntu-latest
    # dsp.c/ui.c/model_registry.c/fm2.c all exist (A-01..A-03), so `make dsp.so`
    # must succeed and the glibc gate must pass. This job is now blocking.
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - name: Cross-compile dsp.so in schwung-builder
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            ghcr.io/charlesvestal/schwung-builder:latest make dsp.so
      - name: glibc / libmvec / export gate
        run: ./scripts/glibc_gate.sh build/dsp.so
      - name: Upload deployable artifact (dsp.so + module.json)
        uses: actions/upload-artifact@v4
        with:
          name: omega-dsp-aarch64
          path: |
            build/dsp.so
            module.json
          if-no-files-found: error
