name: CI

on:
  push:
  pull_request:

jobs:
  native-test:
    name: Native offline harness (make test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make test
        run: make test

  cross-build-gate:
    name: aarch64 cross-build (glibc 2.35) + gate
    # ubuntu-22.04 ships glibc 2.35, matching the Move device target. Its
    # gcc-aarch64-linux-gnu package cross-compiles against the 2.35 aarch64
    # sysroot, so the produced dsp.so passes scripts/glibc_gate.sh (<= 2.35)
    # without needing the private ghcr.io/charlesvestal/schwung-builder image.
    runs-on: ubuntu-22.04
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - name: Install aarch64 cross-toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Cross-compile dsp.so
        run: make dsp.so
      - name: glibc / libmvec / export gate
        run: ./scripts/glibc_gate.sh build/dsp.so
      - name: Cross-compile dr32_engine.so
        run: make dr32_engine.so
      - name: dr32 glibc / libmvec / export gate
        run: ./scripts/glibc_gate.sh build/dr32_engine.so dr32_engine_plugin
      - name: Upload deployable artifact (dsp.so + dr32_engine.so + module.json + help.json)
        uses: actions/upload-artifact@v4
        with:
          name: omega-dsp-aarch64
          path: |
            build/dsp.so
            build/dr32_engine.so
            module.json
            help.json
          if-no-files-found: error
